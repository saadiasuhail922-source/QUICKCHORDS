<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickChords — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F1;--card:#fff;--card2:#F2EFE9;--ink:#141413;--ink2:#625F58;--acc:#C2410C;--line:#E4E0D6;--accbg:#FDEBDD;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1D1C1A;--card2:#262521;--ink:#F3F0E8;--ink2:#A8A398;--acc:#FB923C;--line:#37352F;--accbg:#3A2517}}
:root[data-theme="dark"]{--bg:#141413;--card:#1D1C1A;--card2:#262521;--ink:#F3F0E8;--ink2:#A8A398;--acc:#FB923C;--line:#37352F;--accbg:#3A2517}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Plus Jakarta Sans',Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-right:auto;color:inherit;text-decoration:none}
.brand b{color:var(--acc)}
.brand small{font:500 .7rem 'JetBrains Mono',monospace;color:var(--ink2);margin-left:.6rem}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.lbl{font:500 .7rem 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
button,select{font-size:.8rem;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.4rem .7rem;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .2s}
button:hover,select:hover{border-color:var(--ink2)}
button:active{transform:scale(.96)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{display:flex}.grp button:first-child,.seg2 button:first-child{border-radius:8px 0 0 8px}.grp button:last-child,.seg2 button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.seg2{display:flex}
main{max-width:1100px;margin:0 auto;padding:1rem;display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:minmax(300px,400px) 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.panel{display:flex;flex-direction:column;gap:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{border-radius:99px}
textarea{width:100%;min-height:260px;resize:vertical;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.8rem;font:400 .95rem/1.6 'Plus Jakarta Sans',Georgia,serif}
textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pre{display:flex;flex-direction:column;gap:.4rem}
.pre button{text-align:left;display:flex;justify-content:space-between;gap:.6rem;border-radius:10px}
.pre button span{color:var(--ink2);font-size:.72rem}
.pre button.on span{color:inherit;opacity:.75}
.meta{font:500 .78rem 'JetBrains Mono',monospace;color:var(--ink2);padding-bottom:.8rem;margin-bottom:.8rem;border-bottom:1px dashed var(--line)}
.meta b{color:var(--acc)}
.sheet{min-height:300px;overflow-x:auto}
.ln{margin:0 0 .5rem}
.seg{display:inline-block;vertical-align:bottom}
.ch{display:block;font:700 .88rem/1.6 'JetBrains Mono',monospace;color:var(--acc);padding:0 .8em 0 0;min-height:1.6em;background:none;border:0;border-radius:4px;text-align:left;cursor:pointer}
.ch:hover{background:var(--accbg)}
.ch.e{cursor:default}
.ly{display:block;white-space:pre-wrap;font-size:1.05rem}
.tag{display:inline-block;margin:1.1rem 0 .4rem;font:700 .7rem 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;background:var(--card2);color:var(--ink2);padding:.15rem .5rem;border-radius:4px}
.tag:first-child{margin-top:0}
.gap{height:.5rem}
.hint{font-size:.78rem;color:var(--ink2)}
.empty{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:99px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html" title="Back to home">Quick<b>Chords</b><small>← home</small></a>
  <div class="ctl">
    <span class="lbl">Key</span>
    <select id="root" aria-label="Key"></select>
    <div class="seg2"><button id="maj">Maj</button><button id="min">min</button></div>
    <div class="grp"><button id="dn" aria-label="Down a semitone">−1</button><button id="up" aria-label="Up a semitone">+1</button></div>
    <span class="lbl">Capo</span><select id="capo" aria-label="Capo"></select>
    <button id="copy" class="primary">Copy chord sheet</button>
  </div>
</header>
<main>
  <section class="card panel">
    <div><div class="lbl" style="margin-bottom:.4rem">Load a sample</div>
      <div class="chips" id="samples"></div></div>
    <textarea id="ta" spellcheck="false" placeholder="Paste or type lyrics. Use [Verse 1], [Chorus] labels if you like."></textarea>
    <div><div class="lbl" style="margin-bottom:.4rem">Progression mood</div>
      <div class="pre" id="presets"></div></div>
    <button id="replace">Re-place chords</button>
    <div class="hint">Click a chord to cycle it. Shift-click goes back; Alt-click or right-click removes it.</div>
  </section>
  <section class="card sheet">
    <div class="meta" id="meta"></div>
    <div id="sheet"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
const NS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],NF=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const MAJ=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'],MIN=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const ROOTS=['C','C#','Db','D','Eb','E','F','F#','Gb','G','G#','Ab','A','Bb','B'];
const mod=n=>((n%12)+12)%12;
const idx=n=>{const i=NS.indexOf(n);return i<0?NF.indexOf(n):i};
const spell=(i,fl)=>(fl?NF:NS)[mod(i)];
const flatKey=(r,m)=>r.includes('b')||(!r.includes('#')&&(m?['D','G','C','F']:['F']).includes(r));
function tr(c,n,fl){const m=c.match(/^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/);
  return m?spell(idx(m[1])+n,fl)+m[2]+(m[3]?'/'+spell(idx(m[3])+n,fl):''):c}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isLabel=t=>/^\s*\[.+\]\s*$/.test(t);

const P={
 warm:{n:'Warm / Indie',d:'I – V – vi – IV',a:[[0,''],[7,''],[9,'m'],[5,'']],rel:1},
 moody:{n:'Moody / Late-night',d:'vi – IV – I – V',a:[[9,'m7'],[5,'maj7'],[0,''],[7,'']],rel:1},
 up:{n:'Uplifting',d:'I – IV – vi – V',a:[[0,''],[5,''],[9,'m'],[7,'']],rel:1},
 min:{n:'Melancholic minor',d:'i – VI – III – VII',a:[[0,'m'],[8,''],[3,''],[10,'']],rel:0}};
const SAMPLES={
 indie:{label:'Indie chorus',k:'G',minor:false,preset:'warm',text:`[Chorus]
Leave the porch light on for me
I’m walking home through the golden dark
Every road I’ve ever known
Keeps on leading to your heart
Leave the porch light on for me`},
 night:{label:'Late-night verse + chorus',k:'E',minor:true,preset:'moody',text:`[Verse 1]
City hums beneath the window
Streetlight stains the empty floor
Half a coffee going cold now
Half a song I wrote before

[Chorus]
Stay awake until the morning
Let the quiet say the rest`},
 blank:{label:'Blank starter',k:'C',minor:false,preset:'up',text:`[Verse 1]
Type your first line here and watch the chords land
`}};

const S={lines:[],key:'G',minor:false,capo:0,preset:'warm',text:''};
const $=id=>document.getElementById(id);

const prog=()=>{const p=P[S.preset],t=idx(S.key),b=p.rel&&S.minor?t+3:t,fl=flatKey(S.key,S.minor);
  return p.a.map(([o,q])=>spell(b+o,fl)+q)};
function place(text,pg,c){
  const w=[...text.matchAll(/\S+/g)].map(m=>m.index);if(!w.length)return[];
  const n=w.length<3?1:w.length<7?2:4,out=[];
  for(let i=0;i<n;i++)out.push({pos:w[Math.floor(i*w.length/n)],ch:pg[(c+i)%pg.length]});
  return out}
function build(keep){
  const pg=prog(),old=keep?S.lines.slice():[];let c=0;
  S.lines=S.text.split('\n').map(t=>{
    if(!t.trim()||isLabel(t))return{t,ch:[]};
    const k=old.findIndex(o=>o.t===t&&!o.u);let ch;
    if(k>=0){old[k].u=1;ch=old[k].ch}else ch=place(t,pg,c);
    c+=ch.length;return{t,ch}})}
function xpose(n,nk){const fl=flatKey(nk,S.minor);
  S.lines.forEach(l=>l.ch.forEach(c=>c.ch=tr(c.ch,n,fl)));S.key=nk}
function shapeKey(){return (S.minor?MIN:MAJ)[mod(idx(S.key)-S.capo)]}
const shape=c=>S.capo?tr(c,-S.capo,flatKey(shapeKey(),S.minor)):c;
function opts(){const t=idx(S.key),fl=flatKey(S.key,S.minor);
  const d=S.minor?[[0,'m'],[0,'m7'],[2,'dim'],[3,''],[3,'maj7'],[5,'m'],[5,'m7'],[7,'m'],[7,'m7'],[8,''],[8,'maj7'],[10,''],[10,'7']]
   :[[0,''],[0,'maj7'],[2,'m'],[2,'m7'],[4,'m'],[4,'m7'],[5,''],[5,'maj7'],[7,''],[7,'7'],[9,'m'],[9,'m7'],[11,'dim']];
  return d.map(([o,q])=>spell(t+o,fl)+q)}

function lineHTML(l,i){
  if(!l.t.trim())return'<div class="gap"></div>';
  if(isLabel(l.t))return`<div class="tag">${esc(l.t.trim().replace(/^\[|\]$/g,''))}</div><br>`;
  const cs=l.ch.slice().sort((a,b)=>a.pos-b.pos);
  const seg=(c,txt,ci)=>`<span class="seg">${c?`<button class="ch" data-i="${i}" data-c="${ci}">${esc(shape(c))}</button>`:'<span class="ch e">&nbsp;</span>'}<span class="ly">${esc(txt)||'&nbsp;'}</span></span>`;
  let h='';
  if(!cs.length||cs[0].pos>0)h+=seg('',l.t.slice(0,cs.length?cs[0].pos:undefined),-1);
  cs.forEach((c,j)=>{h+=seg(c.ch,l.t.slice(c.pos,cs[j+1]?cs[j+1].pos:undefined),l.ch.indexOf(c))});
  return`<div class="ln">${h}</div>`}
function renderSheet(){
  const has=S.lines.some(l=>l.t.trim());
  $('sheet').innerHTML=has?S.lines.map(lineHTML).join(''):'<div class="empty">Your chord sheet appears here.</div>'}
function sync(){
  const kl=S.key+(S.minor?'m':'');
  $('root').value=S.key;$('capo').value=S.capo;
  $('maj').classList.toggle('on',!S.minor);$('min').classList.toggle('on',S.minor);
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.preset));
  let m=`Key <b>${kl}</b> · ${prog().join(' – ')}`;
  if(S.capo){const sk=shapeKey();m+=` · Capo <b>${S.capo}</b>: play <b>${sk}${S.minor?'m':''}</b> shapes`}
  $('meta').innerHTML=m;renderSheet()}
function plain(){
  const out=[`Key: ${S.key}${S.minor?'m':''}`];
  if(S.capo)out.push(`Capo ${S.capo} (play ${shapeKey()}${S.minor?'m':''} shapes)`);
  out.push('');
  S.lines.forEach(l=>{
    if(!l.t.trim()||isLabel(l.t)){out.push(l.t.trim());return}
    let s='';l.ch.slice().sort((a,b)=>a.pos-b.pos).forEach(c=>{
      if(s.length<c.pos)s=s.padEnd(c.pos);else if(s)s+=' ';s+=shape(c.ch)});
    if(s)out.push(s);out.push(l.t.replace(/\s+$/,''))});
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
async function copy(){const t=plain();
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  toast('Chord sheet copied')}
function load(k){const s=SAMPLES[k];S.key=s.k;S.minor=s.minor;S.preset=s.preset;S.text=s.text;$('ta').value=s.text;build(false);sync()}

$('root').innerHTML=ROOTS.map(r=>`<option>${r}</option>`).join('');
$('capo').innerHTML=[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}">${n||'None'}</option>`).join('');
$('samples').innerHTML=Object.entries(SAMPLES).map(([k,s])=>`<button data-k="${k}">${s.label}</button>`).join('');
$('presets').innerHTML=Object.entries(P).map(([k,p])=>`<button data-k="${k}">${p.n}<span>${p.d}</span></button>`).join('');

$('samples').onclick=e=>{const b=e.target.closest('button');if(b)load(b.dataset.k)};
$('presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  S.preset=b.dataset.k;if(S.preset==='min')S.minor=true;build(false);sync()};
$('ta').oninput=e=>{S.text=e.target.value;build(true);renderSheet()};
$('root').onchange=e=>{const nk=e.target.value;xpose(mod(idx(nk)-idx(S.key)),nk);sync()};
const step=n=>{xpose(n,(S.minor?MIN:MAJ)[mod(idx(S.key)+n)]);sync()};
$('up').onclick=()=>step(1);$('dn').onclick=()=>step(-1);
$('maj').onclick=()=>{if(S.minor){S.minor=false;build(false);sync()}};
$('min').onclick=()=>{if(!S.minor){S.minor=true;build(false);sync()}};
$('capo').onchange=e=>{S.capo=+e.target.value;sync()};
$('replace').onclick=()=>{build(false);sync()};
$('copy').onclick=copy;

function chordFrom(e){const b=e.target.closest('.ch[data-i]');if(!b)return null;
  const l=S.lines[+b.dataset.i];return{l,c:l.ch[+b.dataset.c]}}
$('sheet').onclick=e=>{const r=chordFrom(e);if(!r)return;
  if(e.altKey){r.l.ch.splice(r.l.ch.indexOf(r.c),1)}
  else{const o=opts(),k=o.indexOf(r.c.ch),d=e.shiftKey?-1:1;
    r.c.ch=o[k<0?0:(k+d+o.length)%o.length]}
  renderSheet()};
$('sheet').oncontextmenu=e=>{const r=chordFrom(e);if(!r)return;e.preventDefault();
  r.l.ch.splice(r.l.ch.indexOf(r.c),1);renderSheet()};

load('indie');
</script>
</body>
</html>
